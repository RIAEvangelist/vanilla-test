name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.12.0'
          - '24'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  coverage:
    name: Native V8 coverage / Node 24 + Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Google Chrome Stable
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Show runtime versions
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node --version
          "$CHROME_PATH" --version

      - name: Install dependencies
        run: npm ci

      - name: Run Node and Chrome coverage
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run coverage -- --chrome-path "$CHROME_PATH"

      - name: Capture fresh screenshots
        if: always()
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run screenshots

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-v8-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-screenshots
          path: |
            example/img/vanilla-test-chrome-v2.png
            example/img/vanilla-test-chrome-coverage-v2.png
            example/img/vanilla-test-node-coverage-v2.png
          if-no-files-found: error
          retention-days: 14

      - name: Assemble GitHub Pages site
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p _site
          git archive --format=tar HEAD | tar --extract --directory=_site

          mkdir -p \
            _site/node_modules/ansi-colors-es6 \
            _site/node_modules/strong-type
          cp node_modules/ansi-colors-es6/index.js _site/node_modules/ansi-colors-es6/
          cp node_modules/strong-type/index.js _site/node_modules/strong-type/
          cp --recursive coverage _site/coverage

          test -f _site/test/index.html
          test -f _site/test/CI.js
          test -f _site/node_modules/ansi-colors-es6/index.js
          test -f _site/node_modules/strong-type/index.js
          test -f _site/coverage/chrome/index.html
          test -f _site/coverage/node/index.html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  package-smoke:
    name: Packed npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack, install, and import the artifact
        shell: bash
        run: |
          TARBALL="$(npm pack --silent)"
          SMOKE_DIRECTORY="$RUNNER_TEMP/vanilla-test-package-smoke"
          mkdir -p "$SMOKE_DIRECTORY"
          cd "$SMOKE_DIRECTORY"
          npm init --yes
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          node --input-type=module --eval "import VanillaTest from 'vanilla-test'; const test = new VanillaTest(); test.expects('packed package imports'); test.pass(); test.done(); const result = test.report(); if (!result.ok || result.total !== 1) process.exitCode = 1;"

      - name: Upload packed npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: vanilla-test-v2-package
          path: vanilla-test-2.0.0.tgz
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: coverage
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
