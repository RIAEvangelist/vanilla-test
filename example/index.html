<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>vanilla-test browser example</title>
        <script type="importmap">
            {
                "imports": {
                    "vanilla-test": "../index.js",
                    "ansi-colors-es6": "../node_modules/ansi-colors-es6/index.js",
                    "strong-type": "../node_modules/strong-type/index.js"
                }
            }
        </script>
        <script type="module" src="./basic.js"></script>
        <style>
            :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
            body { align-items: center; background: #07111f; color: #dcecff; display: grid; margin: 0; min-height: 100vh; padding: 2rem; }
            main { background: #0d1b2e; border: 1px solid #254362; border-radius: 1rem; box-shadow: 0 1.5rem 5rem #0008; margin: auto; max-width: 44rem; padding: 3rem; width: min(100%, 44rem); }
            .eyebrow { color: #66d9ef; font-size: .8rem; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
            h1 { font-size: clamp(2rem, 7vw, 4rem); letter-spacing: -.05em; margin: .4rem 0 1rem; }
            [data-status] { color: #8ea6bd; font-size: 1.2rem; }
            [data-status][data-ok="true"] { color: #7ee787; }
            [data-details] { color: #8ea6bd; }
            code { background: #07111f; border-radius: .35rem; color: #f7c843; padding: .2rem .4rem; }
        </style>
    </head>
    <body>
        <main>
            <p class="eyebrow">Web-standard testing</p>
            <h1>vanilla-test</h1>
            <p>The same untransformed ES module runs in Node and Chrome.</p>
            <p data-status>Running tests…</p>
            <p data-details>Open DevTools to see the detailed report.</p>
            <p><code>npm run start</code></p>
        </main>
    </body>
</html>
