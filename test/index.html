<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>vanilla-test · Chrome verification</title>
    <script type="importmap">
    {
        "imports": {
            "ansi-colors-es6": "../node_modules/ansi-colors-es6/index.js",
            "strong-type": "../node_modules/strong-type/index.js"
        }
    }
    </script>
    <style>
        :root {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #ecfdf5;
            background: #06110d;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 64px 24px;
            background:
                radial-gradient(circle at 15% 0%, rgba(16, 185, 129, .2), transparent 35%),
                radial-gradient(circle at 100% 85%, rgba(34, 211, 238, .12), transparent 32%),
                #06110d;
        }

        main {
            width: min(920px, 100%);
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 26px;
        }

        .brand { display: flex; align-items: center; gap: 16px; }

        .mark {
            display: grid;
            width: 54px;
            height: 54px;
            place-items: center;
            border: 1px solid rgba(110, 231, 183, .45);
            border-radius: 16px;
            color: #6ee7b7;
            background: rgba(6, 78, 59, .55);
            box-shadow: inset 0 1px rgba(255, 255, 255, .08), 0 18px 60px rgba(0, 0, 0, .25);
            font-weight: 850;
            letter-spacing: -.05em;
        }

        h1 { margin: 0; font-size: clamp(1.55rem, 4vw, 2.25rem); letter-spacing: -.04em; }
        .eyebrow { margin: 4px 0 0; color: #8da99d; font-size: .9rem; }

        .runtime {
            padding: 8px 12px;
            border: 1px solid #264a3d;
            border-radius: 999px;
            color: #a7f3d0;
            background: rgba(6, 30, 23, .72);
            font: 650 .76rem ui-monospace, SFMono-Regular, Consolas, monospace;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        [data-vanilla-test-status] {
            overflow: hidden;
            border: 1px solid #234638;
            border-radius: 24px;
            background: rgba(8, 30, 23, .88);
            box-shadow: 0 28px 90px rgba(0, 0, 0, .32);
        }

        .summary {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 24px;
            padding: 30px 32px;
            border-bottom: 1px solid #1c392f;
        }

        .status-line { display: flex; align-items: center; gap: 13px; }
        .pulse { width: 12px; height: 12px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 0 7px rgba(251, 191, 36, .12); }
        [data-ok="true"] .pulse { background: #34d399; box-shadow: 0 0 0 7px rgba(52, 211, 153, .12); }
        [data-ok="false"] .pulse { background: #fb7185; box-shadow: 0 0 0 7px rgba(251, 113, 133, .12); }
        #status-title { margin: 0; font-size: 1.3rem; }
        #status-copy { margin: 7px 0 0 25px; color: #8da99d; }

        .score { color: #6ee7b7; font-size: 2rem; font-weight: 800; letter-spacing: -.06em; }
        [data-ok="false"] .score { color: #fda4af; }

        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: #1c392f;
        }

        .metric { padding: 22px 32px; background: #0a2119; }
        .metric span { display: block; color: #789489; font-size: .76rem; text-transform: uppercase; letter-spacing: .1em; }
        .metric strong { display: block; margin-top: 7px; font-size: 1.5rem; }

        .details { padding: 26px 32px 30px; }
        .details h2 { margin: 0 0 16px; font-size: .82rem; color: #8da99d; text-transform: uppercase; letter-spacing: .12em; }
        ul { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
        li {
            position: relative;
            padding: 11px 14px 11px 38px;
            border: 1px solid #1d3a30;
            border-radius: 10px;
            color: #c8ded5;
            background: rgba(2, 15, 11, .44);
            font-size: .9rem;
        }
        li::before { content: "✓"; position: absolute; left: 14px; color: #34d399; font-weight: 800; }
        li.failure::before { content: "×"; color: #fb7185; }

        footer { margin-top: 18px; color: #617c72; text-align: center; font-size: .8rem; }

        @media (max-width: 620px) {
            body { padding: 32px 14px; }
            header, .summary { align-items: flex-start; }
            header { flex-direction: column; }
            .summary { grid-template-columns: 1fr; }
            .metrics { grid-template-columns: 1fr; }
            .summary, .metric, .details { padding-left: 22px; padding-right: 22px; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div class="brand">
                <div class="mark" aria-hidden="true">VT</div>
                <div>
                    <h1>vanilla-test verification</h1>
                    <p class="eyebrow">One standards-only suite · no transforms · real browser</p>
                </div>
            </div>
            <div class="runtime">Google Chrome</div>
        </header>

        <section data-vanilla-test-status aria-live="polite">
            <div class="summary">
                <div>
                    <div class="status-line"><span class="pulse"></span><h2 id="status-title">Running checks…</h2></div>
                    <p id="status-copy">Loading the same JavaScript module used by Node.</p>
                </div>
                <div class="score" id="score">—</div>
            </div>
            <div class="metrics">
                <div class="metric"><span>Total checks</span><strong id="total">—</strong></div>
                <div class="metric"><span>Passed</span><strong id="passed">—</strong></div>
                <div class="metric"><span>Failed</span><strong id="failed">—</strong></div>
            </div>
            <div class="details">
                <h2>Shared API verification</h2>
                <ul id="checks"><li>Waiting for results</li></ul>
            </div>
        </section>
        <footer>Native ESM · Web platform events · V8 coverage</footer>
    </main>

    <script type="module">
        import run from './CI.js';

        const status = document.querySelector('[data-vanilla-test-status]');
        const checks = document.querySelector('#checks');

        try {
            const result = await run();
            globalThis.__VANILLA_TEST_RESULT__ = result;
            status.dataset.ok = String(result.ok);
            document.querySelector('#status-title').textContent = result.ok ? 'All shared checks passed' : 'Verification failed';
            document.querySelector('#status-copy').textContent = result.ok
                ? 'The same untransformed module passes in Node and Chrome.'
                : `${result.failureCount} check${result.failureCount === 1 ? '' : 's'} need attention.`;
            document.querySelector('#score').textContent = `${result.passed.length}/${result.total}`;
            document.querySelector('#total').textContent = result.total;
            document.querySelector('#passed').textContent = result.passed.length;
            document.querySelector('#failed').textContent = result.failureCount;
            checks.replaceChildren();

            for (const name of result.passed) {
                const item = document.createElement('li');
                item.textContent = name;
                checks.append(item);
            }

            for (const detail of result.failed) {
                const item = document.createElement('li');
                item.className = 'failure';
                item.textContent = detail;
                checks.append(item);
            }
        } catch (error) {
            status.dataset.ok = 'false';
            document.querySelector('#status-title').textContent = 'Harness error';
            document.querySelector('#status-copy').textContent = error instanceof Error ? error.message : String(error);
            document.querySelector('#score').textContent = '×';
            checks.replaceChildren();
        }
    </script>
</body>
</html>
